<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Mundial 2026 - Drag & Drop Jugadores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .controls select {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            margin-right: 10px;
        }

        .controls button {
            padding: 10px 20px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #764ba2;
        }

        .main-content {
            display: flex;
            gap: 20px;
        }

        .players-panel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .album-panel {
            flex: 2;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .player-card {
            width: 120px;
            height: 180px;
            border: 3px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            background: white;
        }

        .player-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .player-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .player-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: white;
        }

        .album-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            min-height: 400px;
        }

        .album-slot {
            width: 120px;
            height: 180px;
            border: 3px dashed #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            transition: background 0.3s, border-color 0.3s;
        }

        .album-slot.drag-over {
            background: #e3f2fd;
            border-color: #667eea;
        }

        .album-slot.occupied {
            border: 3px solid #667eea;
            background: white;
        }

        .album-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slot-number {
            position: absolute;
            font-size: 12px;
            color: #999;
            background: rgba(255,255,255,0.8);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .album-slot {
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
            display: none;
        }

        .album-slot.occupied:hover .remove-btn {
            display: block;
        }

        .stats {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stats p {
            margin: 5px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Album Mundial 2026 - Drag & Drop Jugadores</h1>
        
        <div class="controls">
            <select id="countrySelect">
                <option value="">Selecciona un país</option>
            </select>
            <button onclick="loadPlayers()">Cargar Jugadores</button>
            <button onclick="clearAlbum()">Limpiar Álbum</button>
            <button onclick="saveAlbum()">Guardar Álbum</button>
            <button onclick="loadAlbum()">Cargar Álbum</button>
        </div>

        <div class="main-content">
            <div class="players-panel">
                <div class="panel-title">Jugadores Disponibles</div>
                <div class="players-grid" id="playersGrid">
                    <p style="color: #999; grid-column: 1/-1; text-align: center;">
                        Selecciona un país y carga los jugadores
                    </p>
                </div>
            </div>

            <div class="album-panel">
                <div class="panel-title">Álbum (9 espacios)</div>
                <div class="album-grid" id="albumGrid">
                    <!-- Los slots se generan dinámicamente -->
                </div>
            </div>
        </div>

        <div class="stats">
            <p>Jugadores cargados: <span id="loadedCount">0</span></p>
            <p>Jugadores en álbum: <span id="albumCount">0</span>/9</p>
        </div>
    </div>

    <script>
        const countries = [
            'ALEMANIA', 'ARGENTINA', 'BRASIL', 'COCA_COLA', 'COLOMBIA', 
            'CROACIA', 'ECUADOR', 'ESPAÑA', 'FRANCIA', 'HOLANDA',
            'INGLATERRA', 'MARRUECOS', 'MEXICO', 'NEYMAR', 'NORUEGA',
            'PORTUGAL', 'URUGUAY'
        ];

        let currentPlayers = [];
        let albumSlots = Array(9).fill(null);

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            populateCountrySelect();
            generateAlbumSlots();
            loadAlbum();
        });

        function populateCountrySelect() {
            const select = document.getElementById('countrySelect');
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country.replace(/_/g, ' ');
                select.appendChild(option);
            });
        }

        function generateAlbumSlots() {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 9; i++) {
                const slot = document.createElement('div');
                slot.className = 'album-slot';
                slot.dataset.index = i;
                
                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('dragleave', handleDragLeave);
                slot.addEventListener('drop', handleDrop);
                
                if (albumSlots[i]) {
                    slot.classList.add('occupied');
                    slot.innerHTML = `
                        <img src="${albumSlots[i].image}" alt="Jugador">
                        <button class="remove-btn" onclick="removeFromAlbum(${i})">×</button>
                    `;
                } else {
                    slot.innerHTML = `<span class="slot-number">${i + 1}</span>`;
                }
                
                grid.appendChild(slot);
            }
        }

        async function loadPlayers() {
            const country = document.getElementById('countrySelect').value;
            if (!country) {
                alert('Por favor selecciona un país');
                return;
            }

            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '<p style="color: #999; grid-column: 1/-1; text-align: center;">Cargando jugadores...</p>';

            try {
                const playersPath = `Jugadores_Extraidos/${country}/`;
                currentPlayers = [];

                // Simular carga de jugadores (en producción, esto sería una llamada al servidor)
                for (let i = 1; i <= 18; i++) {
                    const playerNum = String(i).padStart(4, '0');
                    const imagePath = `${playersPath}jugador_${playerNum}.png`;
                    
                    currentPlayers.push({
                        id: `${country}_${playerNum}`,
                        name: `Jugador ${i}`,
                        image: imagePath,
                        country: country
                    });
                }

                displayPlayers();
                updateStats();
            } catch (error) {
                console.error('Error cargando jugadores:', error);
                grid.innerHTML = '<p style="color: red; grid-column: 1/-1; text-align: center;">Error cargando jugadores</p>';
            }
        }

        function displayPlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';

            currentPlayers.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.draggable = true;
                card.dataset.playerId = player.id;
                card.dataset.image = player.image;
                
                const img = document.createElement('img');
                img.src = player.image;
                img.alt = player.name;
                img.onerror = () => {
                    img.style.display = 'none';
                    card.innerHTML = '<p style="font-size: 10px; text-align: center; padding: 5px;">No disponible</p>';
                };
                
                card.appendChild(img);
                
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
                
                grid.appendChild(card);
            });
        }

        function handleDragStart(e) {
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', JSON.stringify({
                playerId: e.target.dataset.playerId,
                image: e.target.dataset.image
            }));
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            const slotIndex = parseInt(e.currentTarget.dataset.index);
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            
            if (albumSlots[slotIndex]) {
                if (!confirm('Este espacio ya está ocupado. ¿Quieres reemplazarlo?')) {
                    return;
                }
            }
            
            albumSlots[slotIndex] = {
                playerId: data.playerId,
                image: data.image
            };
            
            generateAlbumSlots();
            updateStats();
        }

        function removeFromAlbum(index) {
            albumSlots[index] = null;
            generateAlbumSlots();
            updateStats();
        }

        function clearAlbum() {
            if (confirm('¿Estás seguro de que quieres limpiar el álbum?')) {
                albumSlots = Array(9).fill(null);
                generateAlbumSlots();
                updateStats();
            }
        }

        function saveAlbum() {
            localStorage.setItem('mundial2026_album', JSON.stringify(albumSlots));
            alert('Álbum guardado exitosamente');
        }

        function loadAlbum() {
            const saved = localStorage.getItem('mundial2026_album');
            if (saved) {
                albumSlots = JSON.parse(saved);
                generateAlbumSlots();
                updateStats();
            }
        }

        function updateStats() {
            document.getElementById('loadedCount').textContent = currentPlayers.length;
            const occupied = albumSlots.filter(slot => slot !== null).length;
            document.getElementById('albumCount').textContent = occupied;
        }
    </script>
</body>
</html>
