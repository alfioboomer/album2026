	<script>
		const countries = [
			'ALEMANIA', 'ARGENTINA', 'BRASIL', 'COCA_COLA', 'COLOMBIA', 
			'CROACIA', 'ECUADOR', 'ESPAÑA', 'FRANCIA', 'HOLANDA',
			'INGLATERRA', 'MARRUECOS', 'MEXICO', 'NEYMAR', 'NORUEGA',
			'PORTUGAL', 'URUGUAY'
		];

		let currentPlayers = [];
		let albumSlots = Array(9).fill(null);
		let currentPreviewPlayer = null;

		// Country flag mapping (using country codes for flag emojis)
		const countryFlags = {
			'ALEMANIA': 'https://flagcdn.com/w40/de.png',
			'ARGENTINA': 'https://flagcdn.com/w40/ar.png',
			'BRASIL': 'https://flagcdn.com/w40/br.png',
			'COLOMBIA': 'https://flagcdn.com/w40/co.png',
			'CROACIA': 'https://flagcdn.com/w40/hr.png',
			'ECUADOR': 'https://flagcdn.com/w40/ec.png',
			'ESPAÑA': 'https://flagcdn.com/w40/es.png',
			'FRANCIA': 'https://flagcdn.com/w40/fr.png',
			'HOLANDA': 'https://flagcdn.com/w40/nl.png',
			'INGLATERRA': 'https://flagcdn.com/w40/gb-eng.png',
			'MARRUECOS': 'https://flagcdn.com/w40/ma.png',
			'MEXICO': 'https://flagcdn.com/w40/mx.png',
			'NORUEGA': 'https://flagcdn.com/w40/no.png',
			'PORTUGAL': 'https://flagcdn.com/w40/pt.png',
			'URUGUAY': 'https://flagcdn.com/w40/uy.png',
			'COCA_COLA': 'https://flagcdn.com/w40/us.png',
			'NEYMAR': 'https://flagcdn.com/w40/br.png'
		};

		const countryCodes = {
			'ALEMANIA': 'GER',
			'ARGENTINA': 'ARG',
			'BRASIL': 'BRA',
			'COLOMBIA': 'COL',
			'CROACIA': 'CRO',
			'ECUADOR': 'ECU',
			'ESPAÑA': 'ESP',
			'FRANCIA': 'FRA',
			'HOLANDA': 'NED',
			'INGLATERRA': 'ENG',
			'MARRUECOS': 'MAR',
			'MEXICO': 'MEX',
			'NORUEGA': 'NOR',
			'PORTUGAL': 'POR',
			'URUGUAY': 'URU',
			'COCA_COLA': 'CC',
			'NEYMAR': 'NEY'
		};

		function toggleDragDrop() {
			const container = document.getElementById('dragDropContainer');
			container.classList.toggle('active');
		}

		function populateCountrySelect() {
			const select = document.getElementById('countrySelect');
			countries.forEach(country => {
				const option = document.createElement('option');
				option.value = country;
				option.textContent = country.replace(/_/g, ' ');
				select.appendChild(option);
			});
		}

		function generateAlbumSlots() {
			const grid = document.getElementById('albumGrid');
			grid.innerHTML = '';
			
			for (let i = 0; i < 9; i++) {
				const slot = document.createElement('div');
				slot.className = 'album-slot';
				slot.dataset.index = i;
				
				slot.addEventListener('dragover', handleDragOver);
				slot.addEventListener('dragleave', handleDragLeave);
				slot.addEventListener('drop', handleDrop);
				
				if (albumSlots[i]) {
					slot.classList.add('occupied');
					slot.innerHTML = `<img src="${albumSlots[i].image}" alt="Jugador" onerror="this.style.display='none'; this.parentElement.innerHTML='<p style=\\'font-size: 9px; text-align: center; color: #999;\\'>Error</p>'"><button class="remove-btn" onclick="removeFromAlbum(${i})">×</button>`;
					
					// Add hover preview for occupied slots
					const slotData = albumSlots[i];
					slot.addEventListener('mouseenter', () => {
						const player = currentPlayers.find(p => p.id === slotData.playerId);
						if (player) {
							showPlayerPreview(player);
						} else {
							// Create a minimal player object for preview if not in currentPlayers
							const parts = slotData.playerId.split('_');
							const country = parts.slice(0, -1).join('_');
							const num = parts[parts.length - 1];
							showPlayerPreview({
								id: slotData.playerId,
								name: `Jugador ${parseInt(num)}`,
								image: slotData.image,
								country: country
							});
						}
					});
					slot.addEventListener('mouseleave', hidePlayerPreview);
				} else {
					slot.innerHTML = `<span class="slot-number">${i + 1}</span>`;
				}
				
				grid.appendChild(slot);
			}
		}

		function loadPlayers() {
			const country = document.getElementById('countrySelect').value;
			if (!country) {
				alert('Por favor selecciona un país');
				return;
			}

			const grid = document.getElementById('playersGrid');
			grid.innerHTML = '<p style="color: #999; grid-column: 1/-1; text-align: center;">Cargando jugadores...</p>';

			try {
				const playersPath = `Jugadores_Extraidos_incompletos/${country}/`;
				currentPlayers = [];

				// Cargar jugadores disponibles
				for (let i = 1; i <= 18; i++) {
					const playerNum = String(i).padStart(4, '0');
					const imagePath = `${playersPath}jugador_${playerNum}.png`;
					
					currentPlayers.push({
						id: `${country}_${playerNum}`,
						name: `Jugador ${i}`,
						image: imagePath,
						country: country
					});
				}

				displayPlayers();
				updateStats();
			} catch (error) {
				console.error('Error cargando jugadores:', error);
				grid.innerHTML = '<p style="color: red; grid-column: 1/-1; text-align: center;">Error cargando jugadores</p>';
			}
		}

		function displayPlayers() {
			const grid = document.getElementById('playersGrid');
			grid.innerHTML = '';

			currentPlayers.forEach(player => {
				const card = document.createElement('div');
				card.className = 'player-card';
				card.draggable = true;
				card.dataset.playerId = player.id;
				card.dataset.image = player.image;
				
				const img = document.createElement('img');
				img.src = player.image;
				img.alt = player.name;
				img.style.width = '100%';
				img.style.height = '100%';
				img.style.objectFit = 'contain';
				
				card.appendChild(img);
				
				card.addEventListener('dragstart', handleDragStart);
				card.addEventListener('dragend', handleDragEnd);
				
				// Add hover events for player preview
				card.addEventListener('mouseenter', () => showPlayerPreview(player));
				card.addEventListener('mouseleave', hidePlayerPreview);
				
				// Add click event for mobile support
				card.addEventListener('click', (e) => {
					if (!e.target.classList.contains('dragging')) {
						showPlayerPreview(player);
					}
				});
				
				grid.appendChild(card);
			});
		}

		function handleDragStart(e) {
			e.target.classList.add('dragging');
			e.dataTransfer.effectAllowed = 'move';
			e.dataTransfer.setData('text/plain', JSON.stringify({
				playerId: e.target.dataset.playerId,
				image: e.target.dataset.image
			}));
		}

		function handleDragEnd(e) {
			e.target.classList.remove('dragging');
		}

		function handleDragOver(e) {
			e.preventDefault();
			e.dataTransfer.dropEffect = 'move';
			e.currentTarget.classList.add('drag-over');
		}

		function handleDragLeave(e) {
			e.currentTarget.classList.remove('drag-over');
		}

		function handleDrop(e) {
			e.preventDefault();
			e.stopPropagation();
			e.currentTarget.classList.remove('drag-over');
			
			const slotIndex = parseInt(e.currentTarget.dataset.index);
			const data = JSON.parse(e.dataTransfer.getData('text/plain'));
			
			if (albumSlots[slotIndex]) {
				if (!confirm('Este espacio ya está ocupado. ¿Quieres reemplazarlo?')) {
					return;
				}
			}
			
			albumSlots[slotIndex] = {
				playerId: data.playerId,
				image: data.image
			};
			
			generateAlbumSlots();
			updateStats();
		}

		function removeFromAlbum(index) {
			albumSlots[index] = null;
			generateAlbumSlots();
			updateStats();
		}

		function clearAlbum() {
			if (confirm('¿Estás seguro de que quieres limpiar el álbum?')) {
				albumSlots = Array(9).fill(null);
				generateAlbumSlots();
				updateStats();
			}
		}

		function saveAlbum() {
			localStorage.setItem('mundial2026_album', JSON.stringify(albumSlots));
			alert('Álbum guardado exitosamente');
		}

		function loadAlbum() {
			const saved = localStorage.getItem('mundial2026_album');
			if (saved) {
				albumSlots = JSON.parse(saved);
				generateAlbumSlots();
				updateStats();
			}
		}

		function updateStats() {
			document.getElementById('loadedCount').textContent = currentPlayers.length;
			const occupied = albumSlots.filter(slot => slot !== null).length;
			document.getElementById('albumCount').textContent = occupied;
		}

		// Player Preview Functions
		function showPlayerPreview(player) {
			console.log('Showing preview for:', player);
			const preview = document.getElementById('playerPreview');
			if (!preview) {
				console.error('Preview element not found');
				return;
			}
			
			const previewImage = document.getElementById('previewImage');
			const previewFlag = document.getElementById('previewFlag');
			const previewCountry = document.getElementById('previewCountry');
			const previewNumber = document.getElementById('previewNumber');
			const previewName = document.getElementById('previewName');
			const previewTeam = document.getElementById('previewTeam');

			currentPreviewPlayer = player;

			// Set preview data
			previewImage.src = player.image;
			previewFlag.src = countryFlags[player.country] || countryFlags['ARGENTINA'];
			previewCountry.textContent = player.country.replace(/_/g, ' ');
			
			const countryCode = countryCodes[player.country] || player.country.substring(0, 3).toUpperCase();
			const playerNum = player.id.split('_').pop();
			previewNumber.textContent = `${countryCode} ${playerNum}`;
			previewName.textContent = player.name;
			previewTeam.textContent = 'Seleccion Nacional';

			// Show preview with animation
			preview.classList.add('active');
			console.log('Preview activated');
		}

		function hidePlayerPreview() {
			console.log('Hiding preview');
			const preview = document.getElementById('playerPreview');
			if (preview) {
				preview.classList.remove('active');
				currentPreviewPlayer = null;
			}
		}

		// Initialize
		document.addEventListener('DOMContentLoaded', () => {
			populateCountrySelect();
			generateAlbumSlots();
			loadAlbum();
		});
	</script>
